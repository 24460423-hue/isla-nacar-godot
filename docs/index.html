<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Isla Nácar · La luz entre las mareas</title><meta name="description" content="Un juego 3D: explora la isla, recupera doce fragmentos de luz y esquiva a los guardianes. WASD y espacio para jugar."><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102e3d;color:#f5f0df;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#carga{position:fixed;inset:0;display:grid;place-items:center;background:#102e3d;z-index:4;text-align:center;padding:2rem}.centro{max-width:30rem}h1{letter-spacing:.14em;font-size:3rem;margin:1rem 0;color:#edca85}p{font-size:1rem;line-height:1.6;color:#bbd7cc}.gema{width:48px;height:64px;margin:auto;background:#8be5ca;clip-path:polygon(50% 0,100% 36%,75% 100%,25% 100%,0 36%)}progress{width:18rem;max-width:80vw;height:.6rem;accent-color:#8be5ca}small{color:#9ebeb6}#error{display:none;color:#edb7a4}</style><link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
</head><body><canvas id="canvas" tabindex="0" aria-label="Isla Nácar, juego 3D. Usa WASD o las flechas, espacio para saltar, y shift para correr."></canvas><div id="carga"><div class="centro"><div class="gema"></div><h1>ISLA NÁCAR</h1><p id="mensaje">Preparando la isla y su última luz…</p><progress id="progreso" max="1" value="0"></progress><p><small>WASD · mover &nbsp; ESPACIO · saltar &nbsp; SHIFT · correr</small></p><p id="error"></p></div></div><script src="index.js"></script><script>
const canvas=document.getElementById('canvas');
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":104420,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
window.islaEngine=engine;
engine.startGame({canvas:canvas,onProgress:(actual,total)=>{if(total>0)document.getElementById('progreso').value=actual/total;}}).then(()=>{document.getElementById('carga').remove();canvas.focus();window.islaCargada=true;}).catch(error=>{document.getElementById('mensaje').textContent='No se pudo cargar la isla';document.getElementById('error').style.display='block';document.getElementById('error').textContent=String(error)+' · Prueba un navegador con WebGL 2.';console.error(error);});
window.addEventListener('keydown',event=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code))event.preventDefault();});canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
